[pytest]
testpaths = tests
pythonpath = .
# Testes de integração acessam a API real: ficam fora do `pytest` padrão (e do CI).
# Rodar explicitamente com:  pytest -m integracao
addopts = --basetemp=tests/.pytest_cache -m "not integracao"
markers =
    integracao: acessa APIs reais pela rede (opcional; rodar com `pytest -m integracao`)
