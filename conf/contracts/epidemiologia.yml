# Contrato de dados: Notificações de arboviroses (Dados Abertos Recife)
# FND-02 / ING-02 / ARQUITETURA §2.1, §10
tabela: epidemiologia
# O número de notificação (NU_NOTIFIC) sozinho NÃO é único (BUG-07): em dado
# real há 94 números repetidos entre agravos e 2 dentro da própria dengue —
# notificações diferentes (outra data, outro bairro) com o mesmo número. A
# chave do SINAN é número + agravo + data de notificação (+ município de
# notificação, hoje não levado à Bronze). Com [agravo, protocolo,
# data_notificacao] há 0 colisões nos 11.950 registros reais de 2025.
chave_negocio:
  - agravo
  - protocolo
  - data_notificacao
campo_data_referencia: data_notificacao
campos:
  - nome: protocolo
    tipo: string
    obrigatorio: true
    descricao: Número identificador único da notificação no SINAN / Dados Abertos
  - nome: data_notificacao
    tipo: datetime
    obrigatorio: true
    descricao: Data em que a notificação foi registrada no sistema
  - nome: semana_epidemiologica
    tipo: int
    obrigatorio: true
    descricao: Semana epidemiológica do caso (ex. 202510)
  - nome: ano
    tipo: int
    obrigatorio: true
    descricao: Ano de referência da notificação
  - nome: bairro
    tipo: string
    obrigatorio: true
    descricao: Nome do bairro de residência do paciente (texto de origem)
  - nome: agravo
    tipo: string
    obrigatorio: true
    descricao: Tipo de arbovirose notificada
    valores_permitidos:
      - dengue
      - zika
      - chikungunya
  - nome: classificacao_final
    tipo: string
    obrigatorio: false
    descricao: Classificação final do caso (ex. confirmado, descartado, inconclusivo, sob_investigacao)
  - nome: contagem
    tipo: int
    obrigatorio: true
    descricao: Quantidade de casos notificados representados pela linha
