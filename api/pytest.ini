[pytest]
testpaths = tests
pythonpath = .
# Testes de integração usam o Neon real (usuário só de leitura): ficam fora do
# `pytest` padrão e do CI. Rodar com:  pytest -m integracao
addopts = -m "not integracao" -p no:cacheprovider
markers =
    integracao: acessa o Neon real (opcional; rodar com `pytest -m integracao`)
