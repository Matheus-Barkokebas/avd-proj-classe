# Testes do servidor MCP (sem rede) a cada push e PR que mexa em mcp-servidor/.
name: mcp

on:
  push:
    branches: [develop, main]
    paths: ["mcp-servidor/**", ".github/workflows/mcp.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["mcp-servidor/**", ".github/workflows/mcp.yml"]

jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp-servidor/requirements.txt
            mcp-servidor/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check .
      - name: pytest
        run: python -m pytest -q
