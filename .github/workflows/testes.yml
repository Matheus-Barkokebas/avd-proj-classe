# Testes do pipeline (sem rede) a cada push e PR. Os de integração (`pytest -m integracao`)
# ficam de fora: dependem das APIs públicas e das credenciais do Atlas e do Neon.
name: testes

on:
  push:
    branches: [develop, main]
    paths: ["pipeline/**", ".github/workflows/testes.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["pipeline/**", ".github/workflows/testes.yml"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
            pipeline/requirements-modelo.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-modelo.txt
      - name: ruff
        run: python -m ruff check .
      - name: pytest
        run: python -m pytest -q
