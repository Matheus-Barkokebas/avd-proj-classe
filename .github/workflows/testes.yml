# Roda a suíte automatizada (sem rede) a cada push e PR nas branches principais.
# Os testes de integração contra as APIs reais (`pytest -m integracao`) ficam
# de fora de propósito: dependem da disponibilidade das APIs públicas e das
# credenciais do Atlas/Neon, que não ficam no CI.
#
# Monorepo: um job por módulo, disparado só quando a pasta dele muda.
# Os jobs de `api/` e `frontend/` entram junto com o código de cada um.
name: testes

on:
  push:
    branches: [develop, main]
    paths: ["pipeline/**", ".github/workflows/testes.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["pipeline/**", ".github/workflows/testes.yml"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
