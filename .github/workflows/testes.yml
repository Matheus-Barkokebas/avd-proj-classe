# Roda a suíte automatizada (sem rede) a cada push e PR nas branches principais.
# Os testes de integração contra as APIs reais (`pytest -m integracao`) ficam
# de fora de propósito: dependem da disponibilidade das APIs públicas.
name: testes

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
