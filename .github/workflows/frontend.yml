# Checagens do painel (sem API real: os testes simulam o fetch) a cada push e PR que mexa em frontend/.
name: frontend

on:
  push:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Tipos
        run: npm run tipos
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
