# Testes da API (sem rede) a cada push e PR que mexa em api/.
# Os testes de integração contra o Neon (`pytest -m integracao`) ficam de fora:
# dependem da credencial só de leitura, que não fica no CI.
name: api

on:
  push:
    branches: [develop, main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["api/**", ".github/workflows/api.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
